<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هوش</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --me:#2f5bea; --ai:#232733; --tx:#e8eaf0; --mut:#8b90a0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--tx); font-family: system-ui, Tahoma, sans-serif; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: var(--card); display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 18px; }
  header button { background: none; border: 1px solid var(--mut); color: var(--mut); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  .bar { padding: 8px 12px; background: var(--card); border-top: 1px solid #2a2e3a; }
  #model { width: 100%; background: var(--bg); color: var(--tx); border: 1px solid #333846; border-radius: 10px; padding: 8px 10px; font-size: 14px; direction: ltr; text-align: left; }
  #count { font-size: 12px; color: var(--mut); margin-top: 4px; }
  #chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .m { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
  .me { background: var(--me); align-self: flex-start; }
  .ai { background: var(--ai); align-self: flex-end; }
  .err { background: #5a1f27; align-self: center; font-size: 14px; }
  form { display: flex; gap: 8px; padding: 10px; background: var(--card); padding-bottom: max(10px, env(safe-area-inset-bottom)); }
  textarea { flex: 1; resize: none; background: var(--bg); color: var(--tx); border: 1px solid #333846; border-radius: 12px; padding: 10px; font-size: 16px; font-family: inherit; max-height: 120px; }
  form button { background: var(--me); color: #fff; border: 0; border-radius: 12px; padding: 0 18px; font-size: 16px; }
  form button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <b>هوش</b>
  <div>
    <button id="newBtn" type="button">گفتگوی جدید</button>
    <button id="keyBtn" type="button">رمز</button>
  </div>
</header>
<div class="bar">
  <input id="model" list="models" placeholder="مدل رایگان را جستجو کن، مثلاً gemma یا llama" autocomplete="off" autocapitalize="off" spellcheck="false">
  <datalist id="models"></datalist>
  <div id="count">در حال دریافت لیست مدل‌ها...</div>
</div>
<div id="chat"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="پیام بنویس..."></textarea>
  <button id="send" type="submit">ارسال</button>
</form>

<script>
const chat = document.getElementById('chat');
const t = document.getElementById('t');
const send = document.getElementById('send');
let history = [];
const DEFAULT_MODEL = 'openrouter/free';
const modelInput = document.getElementById('model');
try { modelInput.value = localStorage.getItem('model') || DEFAULT_MODEL; } catch (e) { modelInput.value = DEFAULT_MODEL; }
modelInput.onfocus = () => modelInput.select();
modelInput.onchange = () => { try { localStorage.setItem('model', modelInput.value.trim()); } catch (e) {} };

(async () => {
  const count = document.getElementById('count');
  try {
    const r = await fetch('/models');
    const d = await r.json();
    const dl = document.getElementById('models');
    d.models.forEach(m => {
      const o = document.createElement('option');
      o.value = m.id;
      o.label = (m.tools ? '🛠 ' : '') + m.name;
      dl.appendChild(o);
    });
    const ids = d.models.map(m => m.id);
    if (!ids.includes(modelInput.value) && !modelInput.value.endsWith(':free') && modelInput.value !== DEFAULT_MODEL) {
      modelInput.value = DEFAULT_MODEL;
      try { localStorage.setItem('model', DEFAULT_MODEL); } catch (e) {}
    }
    count.textContent = d.models.length + ' مدل رایگان موجود است (🛠 یعنی از اجرای کد پشتیبانی می‌کند). تایپ کن تا جستجو شود.';
  } catch (e) {
    count.textContent = 'لیست مدل‌ها دریافت نشد. می‌توانی اسم مدل را دستی بنویسی.';
  }
})();

function getKey() {
  try {
    let k = localStorage.getItem('hostKey');
    if (!k) { k = prompt('رمز میزبان (HOST_API_KEY) را وارد کن:') || ''; localStorage.setItem('hostKey', k); }
    return k;
  } catch (e) { return prompt('رمز میزبان را وارد کن:') || ''; }
}

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

document.getElementById('keyBtn').onclick = () => {
  const k = prompt('رمز جدید میزبان:');
  if (k !== null) { try { localStorage.setItem('hostKey', k); } catch (e) {} }
};
document.getElementById('newBtn').onclick = () => { history = []; chat.innerHTML = ''; };

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const text = t.value.trim();
  if (!text) return;
  t.value = '';
  add(text, 'me');
  history.push({ role: 'user', content: text });
  send.disabled = true;
  const wait = add('...', 'ai');
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': getKey() },
      body: JSON.stringify({ messages: history, model: modelInput.value.trim() || DEFAULT_MODEL })
    });
    if (r.status === 401) {
      try { localStorage.removeItem('hostKey'); } catch (e) {}
      throw new Error('رمز اشتباه است. دوباره بفرست و رمز درست را وارد کن.');
    }
    if (!r.ok) throw new Error('خطا ' + r.status + ': ' + (await r.text()).slice(0, 200));
    const data = await r.json();
    const reply = data.choices[0].message.content;
    wait.textContent = reply;
    (data.tool_log || []).forEach(t => {
      const d = document.createElement('details');
      d.style.marginTop = '8px';
      const s = document.createElement('summary');
      s.textContent = '🛠 اجرای کد پایتون';
      const pre = document.createElement('pre');
      pre.style.cssText = 'direction:ltr;text-align:left;white-space:pre-wrap;font-size:12px;background:#0f1115;padding:8px;border-radius:8px;overflow-x:auto;margin:6px 0 0';
      pre.textContent = t.code + '\n\n--- خروجی ---\n' + t.output;
      d.append(s, pre);
      wait.appendChild(d);
    });
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    wait.className = 'm err';
    wait.textContent = err.message;
    history.pop();
  }
  send.disabled = false;
  chat.scrollTop = chat.scrollHeight;
};
</script>
</body>
</html>
