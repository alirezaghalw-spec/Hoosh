<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>هوش</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3a3a4a; --bg:#ffffff;
  --pink:#ffc8dd; --blue:#bde0fe; --mint:#b9fbc0; --yellow:#fdffb6; --lav:#cdb4db;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Vazirmatn',system-ui,sans-serif; font-size:15px;
  display:flex; flex-direction:column; max-width:760px; margin:0 auto;
}
.px{font-family:'Press Start 2P',monospace; font-size:11px; letter-spacing:0}
header{
  display:flex; align-items:center; gap:8px; padding:10px;
  border-bottom:4px solid var(--ink); background:var(--bg);
}
header h1{margin:0; font-size:16px; flex:1; display:flex; align-items:center; gap:8px; min-width:0}
.logo{width:32px;height:32px;image-rendering:pixelated;flex:none}
.btn{
  font-family:inherit; font-size:13px; color:var(--ink); cursor:pointer;
  border:3px solid var(--ink); padding:8px 12px; background:var(--blue);
  box-shadow:4px 4px 0 var(--ink);
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  position:relative; top:0; left:0;
}
.btn:active{top:3px;left:-3px;box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)}
.btn.yellow{background:var(--yellow)} .btn.lav{background:var(--lav)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:3px 8px;font-size:11px;box-shadow:2px 2px 0 var(--ink)}
#modelBtn{max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
#chat{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px}
.msg{
  max-width:92%; padding:10px 12px; border:3px solid var(--ink);
  word-break:break-word; line-height:1.9;
  box-shadow:4px 4px 0 var(--ink);
}
.msg.user{align-self:flex-start; background:var(--mint); white-space:pre-wrap}
.msg.bot{align-self:flex-end; background:var(--yellow)}
.msg.err{align-self:center; background:var(--pink); white-space:pre-wrap}
.msg p{margin:0 0 8px} .msg p:last-child{margin-bottom:0}
.msg h1,.msg h2,.msg h3,.msg h4{margin:8px 0 4px;font-size:15px;line-height:1.7}
.msg ul,.msg ol{margin:4px 0 8px;padding-inline-start:22px}
.msg blockquote{margin:6px 0;padding:2px 10px;border-inline-start:4px solid var(--ink);background:rgba(255,255,255,.6)}
.msg a{color:#1d4ed8}
.msg code.il{font-family:monospace;direction:ltr;unicode-bidi:embed;background:#fff;border:1px solid var(--ink);padding:0 4px;font-size:13px}
.codebox{margin:8px 0;border:3px solid var(--ink);background:#fff;direction:ltr;text-align:left}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 6px;background:var(--lav);border-bottom:3px solid var(--ink);font-family:monospace;font-size:12px}
.codebox pre{margin:0;padding:8px;overflow-x:auto;font-family:monospace;font-size:12.5px;line-height:1.6;white-space:pre}
.tool{margin:8px 0;border:2px dashed var(--ink);background:#fff;direction:ltr;text-align:left;font-family:monospace;font-size:12px}
.tool summary{cursor:pointer;padding:4px 8px;background:var(--blue)}
.tool pre{margin:0;padding:6px 8px;white-space:pre-wrap;word-break:break-word;border-top:2px dashed var(--ink)}
.tool .lbl{padding:2px 8px;font-size:11px;opacity:.7;border-top:2px dashed var(--ink)}
.dots{opacity:.6}
.empty{margin:auto;text-align:center;line-height:2.4}
form{display:flex; gap:8px; padding:10px; border-top:4px solid var(--ink); align-items:flex-end}
textarea{
  flex:1; resize:none; font-family:inherit; font-size:15px; color:var(--ink);
  border:3px solid var(--ink); padding:8px; background:#fff; max-height:140px; outline:none;
}
textarea:focus{background:#fffef0}
.overlay{position:fixed;inset:0;background:rgba(58,58,74,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:10}
.overlay.on{display:flex}
.card{background:#fff;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;padding:12px;gap:10px}
.card h2{margin:0;font-size:15px}
.card input{font-family:inherit;font-size:14px;border:3px solid var(--ink);padding:8px;outline:none;direction:ltr;width:100%}
#modelList,#convList{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#modelList{direction:ltr}
.mitem{
  text-align:left;font-family:monospace;font-size:12px;padding:8px;cursor:pointer;
  border:3px solid var(--ink);background:#fff;word-break:break-all;color:var(--ink)
}
.mitem:hover{background:var(--blue)}
.mitem.sel{background:var(--pink)}
.citem{display:flex;gap:6px;align-items:stretch}
.citem .mitem{flex:1;text-align:start;font-family:inherit;font-size:13px;direction:rtl;word-break:normal}
.citem .del{border:3px solid var(--ink);background:#fff;cursor:pointer;padding:0 10px;font-size:16px;color:var(--ink)}
.citem .del:hover{background:var(--pink)}
.row{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}
.note{font-size:12px;opacity:.8;line-height:1.8}
</style>
</head>
<body>

<header>
  <h1>
    <svg class="logo" viewBox="0 0 8 8" shape-rendering="crispEdges">
      <rect width="8" height="8" fill="#ffffff"/>
      <rect x="1" y="1" width="6" height="5" fill="#cdb4db"/>
      <rect x="2" y="2" width="1" height="1" fill="#3a3a4a"/>
      <rect x="5" y="2" width="1" height="1" fill="#3a3a4a"/>
      <rect x="2" y="4" width="4" height="1" fill="#ffc8dd"/>
      <rect x="3" y="0" width="2" height="1" fill="#3a3a4a"/>
      <rect x="1" y="6" width="6" height="1" fill="#3a3a4a"/>
    </svg>
    هوش
  </h1>
  <button class="btn mint" id="convBtn" type="button">☰ گفتگوها</button>
  <button class="btn lav px" id="modelBtn" type="button">MODEL</button>
  <button class="btn yellow" id="setBtn" type="button">⚙</button>
</header>

<div id="chat"></div>

<form id="form">
  <textarea id="input" rows="1" placeholder="پیامت را بنویس..."></textarea>
  <button class="btn pink" id="sendBtn" type="submit">ارسال</button>
</form>

<!-- فهرست گفتگوها -->
<div class="overlay" id="convOv">
  <div class="card">
    <h2>گفتگوها</h2>
    <div class="row">
      <button class="btn mint" id="convNew" type="button">+ گفتگوی تازه</button>
      <button class="btn" id="convClose" type="button">بستن</button>
    </div>
    <div id="convList"></div>
  </div>
</div>

<!-- انتخاب مدل -->
<div class="overlay" id="modelOv">
  <div class="card">
    <h2>انتخاب مدل هوش مصنوعی</h2>
    <input id="modelSearch" placeholder="search..." autocomplete="off">
    <div id="modelList"></div>
    <div class="row">
      <button class="btn mint" id="modelRefresh" type="button">بارگذاری دوباره</button>
      <button class="btn" id="modelClose" type="button">بستن</button>
    </div>
  </div>
</div>

<!-- تنظیمات -->
<div class="overlay" id="setOv">
  <div class="card">
    <h2>تنظیمات</h2>
    <div class="note">رمز سایت (همان HOST_API_KEY که در Render گذاشتی). فقط روی همین گوشی ذخیره می‌شود.</div>
    <input id="keyInput" type="password" placeholder="password" autocomplete="off">
    <div class="note" id="keyState"></div>
    <div class="row">
      <button class="btn mint" id="keySave" type="button">ذخیره</button>
      <button class="btn pink" id="clearAll" type="button">حذف همهٔ گفتگوها</button>
      <button class="btn" id="setClose" type="button">بستن</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input'), sendBtn = $('sendBtn');
let allModels = [];
let busy = false;
let abortCtl = null;

/* ---------- ذخیره‌سازی ---------- */
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const getKey = () => lsGet('hoosh_key', '');
const getModel = () => lsGet('hoosh_model', 'openrouter/free');
function showModel(){ $('modelBtn').textContent = getModel(); }
showModel();

let convs = [];
try{ convs = JSON.parse(lsGet('hoosh_convs', '[]')); }catch(e){ convs = []; }
if (!Array.isArray(convs)) convs = [];
let curId = lsGet('hoosh_cur', '');

function saveConvs(){
  convs.sort((a,b) => b.updated - a.updated);
  if (convs.length > 50) convs.length = 50;
  let s = JSON.stringify(convs);
  while (!lsSet('hoosh_convs', s) && convs.length > 1){ convs.pop(); s = JSON.stringify(convs); }
  lsSet('hoosh_cur', curId);
}
function cur(){ return convs.find(c => c.id === curId) || null; }
function newConv(){
  const c = {id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), title: 'گفتگوی تازه', messages: [], updated: Date.now()};
  convs.push(c); curId = c.id; saveConvs(); return c;
}

/* ---------- رندر مارک‌داون (بدون innerHTML) ---------- */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function copyText(t, btn){
  const done = () => { const o = btn.textContent; btn.textContent = 'کپی شد'; setTimeout(() => btn.textContent = o, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){}
  ta.remove();
}
function inline(text, parent){
  const re = /(`[^`\n]+`|\*\*[^*\n]+\*\*|\*[^*\n]+\*|\[[^\]\n]+\]\([^)\s]+\))/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    const t = m[0];
    if (t[0] === '`') parent.appendChild(el('code', 'il', t.slice(1, -1)));
    else if (t.startsWith('**')) parent.appendChild(el('strong', '', t.slice(2, -2)));
    else if (t[0] === '*') parent.appendChild(el('em', '', t.slice(1, -1)));
    else {
      const mm = /^\[([^\]]+)\]\(([^)]+)\)$/.exec(t);
      if (mm && /^https?:\/\//i.test(mm[2])){
        const a = el('a', '', mm[1]); a.href = mm[2]; a.target = '_blank'; a.rel = 'noopener noreferrer';
        parent.appendChild(a);
      } else parent.appendChild(document.createTextNode(t));
    }
    last = m.index + t.length;
  }
  if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}
function codeBlock(lang, code){
  const box = el('div', 'codebox');
  const head = el('div', 'codehead');
  head.appendChild(el('span', '', lang || 'code'));
  const b = el('button', 'btn sm', 'کپی'); b.type = 'button';
  b.onclick = () => copyText(code, b);
  head.appendChild(b);
  const pre = el('pre'); pre.textContent = code;
  box.appendChild(head); box.appendChild(pre);
  return box;
}
function blocks(text, parent){
  const lines = text.split('\n');
  let i = 0;
  while (i < lines.length){
    const ln = lines[i];
    if (!ln.trim()){ i++; continue; }
    let m;
    if ((m = /^(#{1,4})\s+(.*)$/.exec(ln))){
      const h = el('h' + m[1].length); h.dir = 'auto'; inline(m[2], h); parent.appendChild(h); i++; continue;
    }
    if (/^\s*[-*]\s+/.test(ln) || /^\s*\d+[.)]\s+/.test(ln)){
      const ordered = /^\s*\d+[.)]\s+/.test(ln);
      const list = el(ordered ? 'ol' : 'ul');
      const rx = ordered ? /^\s*\d+[.)]\s+(.*)$/ : /^\s*[-*]\s+(.*)$/;
      while (i < lines.length && (m = rx.exec(lines[i]))){
        const li = el('li'); li.dir = 'auto'; inline(m[1], li); list.appendChild(li); i++;
      }
      parent.appendChild(list); continue;
    }
    if (/^>\s?/.test(ln)){
      const q = el('blockquote'); const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      q.dir = 'auto'; inline(buf.join(' '), q); parent.appendChild(q); continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*]\s|\s*\d+[.)]\s|>)/.test(lines[i])){ buf.push(lines[i]); i++; }
    if (!buf.length){ buf.push(lines[i]); i++; }
    const p = el('p'); p.dir = 'auto';
    buf.forEach((l, k) => { if (k) p.appendChild(document.createElement('br')); inline(l, p); });
    parent.appendChild(p);
  }
}
function renderMd(text, parent){
  const re = /```([\w+#.-]*)[ \t]*\n?([\s\S]*?)(```|$)/g;
  let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) blocks(text.slice(last, m.index), parent);
    parent.appendChild(codeBlock(m[1], m[2].replace(/\n$/, '')));
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  if (last < text.length) blocks(text.slice(last), parent);
}

/* ---------- ساخت پیام‌ها ---------- */
function toolBox(code, output){
  const d = el('details', 'tool');
  d.appendChild(el('summary', '', output === null ? 'ابزار: در حال اجرا...' : 'ابزار: اجرای کد'));
  d.appendChild(el('pre', '', code));
  if (output !== null){
    d.appendChild(el('div', 'lbl', 'خروجی'));
    d.appendChild(el('pre', '', output));
  }
  return d;
}
function clearEmpty(){ const e = $('empty'); if (e) e.remove(); }
function addUser(text){
  clearEmpty();
  const d = el('div', 'msg user', text); chat.appendChild(d); scrollDown(); return d;
}
function addErr(text){
  clearEmpty();
  const d = el('div', 'msg err', text); chat.appendChild(d); scrollDown(); return d;
}
function addBotShell(){
  clearEmpty();
  const d = el('div', 'msg bot');
  chat.appendChild(d); scrollDown(); return d;
}
function nearBottom(){ return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80; }
function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

/* پیام ربات = دنباله‌ای از تکه‌ها: {t:'text',v} یا {t:'tool',code,output} */
function renderBot(node, parts, pending){
  node.textContent = '';
  parts.forEach(p => {
    if (p.t === 'text'){ if (p.v) { const w = el('div'); renderMd(p.v, w); node.appendChild(w); } }
    else node.appendChild(toolBox(p.code, p.output));
  });
  if (pending && !node.firstChild) node.appendChild(el('span', 'dots', '...'));
}

function renderChat(){
  chat.textContent = '';
  const c = cur();
  if (!c || !c.messages.length){
    const e = el('div', 'empty'); e.id = 'empty';
    const a = el('div', 'px', 'HELLO!'); a.style.lineHeight = '2';
    e.appendChild(a); e.appendChild(el('div', '', 'سلام! یک پیام بنویس تا شروع کنیم.'));
    chat.appendChild(e); return;
  }
  c.messages.forEach(m => {
    if (m.role === 'user') addUser(m.content);
    else { const n = addBotShell(); renderBot(n, m.parts || [{t:'text', v:m.content}], false); }
  });
  scrollDown();
}

/* ---------- ارسال و دریافت جریانی ---------- */
function partsText(parts){
  return parts.filter(p => p.t === 'text').map(p => p.v).join('');
}
function payloadMessages(c){
  let msgs = c.messages.map(m => ({role: m.role, content: String(m.content || '').slice(0, 20000)}));
  msgs = msgs.filter(m => m.content);
  if (msgs.length > 40) msgs = msgs.slice(-40);
  let total = 0, keep = [];
  for (let i = msgs.length - 1; i >= 0; i--){
    total += msgs[i].content.length;
    if (total > 100000) break;
    keep.unshift(msgs[i]);
  }
  while (keep.length && keep[0].role !== 'user') keep.shift();
  return keep;
}

function setBusy(b){
  busy = b;
  sendBtn.textContent = b ? 'توقف' : 'ارسال';
  sendBtn.classList.toggle('pink', !b);
  sendBtn.classList.toggle('yellow', b);
}

async function send(){
  if (busy){ if (abortCtl) abortCtl.abort(); return; }
  const text = input.value.trim();
  if (!text) return;
  if (!getKey()){ openSettings(); addErr('اول رمز سایت را در تنظیمات وارد کن.'); return; }

  let c = cur() || newConv();
  input.value = ''; input.style.height = 'auto';
  c.messages.push({role: 'user', content: text});
  if (c.messages.length === 1) c.title = text.slice(0, 40);
  c.updated = Date.now(); saveConvs();
  clearEmpty(); addUser(text);

  const node = addBotShell();
  const parts = [];
  renderBot(node, parts, true);
  setBusy(true);
  abortCtl = new AbortController();
  let failed = null;
  let raf = 0;
  const paint = () => { raf = 0; const stick = nearBottom(); renderBot(node, parts, true); if (stick) scrollDown(); };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(paint); };

  try{
    const r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-api-key': getKey()},
      body: JSON.stringify({messages: payloadMessages(c), model: getModel(), stream: true}),
      signal: abortCtl.signal
    });
    if (!r.ok){
      let d = null; try{ d = await r.json(); }catch(e){}
      if (r.status === 401 || r.status === 403){
        lsDel('hoosh_key'); failed = 'رمز اشتباه است. دوباره در تنظیمات وارد کن.';
      } else {
        const det = d && (d.detail || d.error);
        failed = 'خطا ' + r.status + (det ? ': ' + (typeof det === 'string' ? det : JSON.stringify(det)) : '');
      }
    } else {
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      let finished = false;
      const handle = ev => {
        if (ev.type === 'delta'){
          const last = parts[parts.length - 1];
          if (last && last.t === 'text') last.v += ev.text; else parts.push({t: 'text', v: ev.text});
        } else if (ev.type === 'tool_start'){
          parts.push({t: 'tool', code: ev.code, output: null});
        } else if (ev.type === 'tool_result'){
          const tp = parts.slice().reverse().find(p => p.t === 'tool' && p.output === null);
          if (tp) tp.output = ev.output; else parts.push({t: 'tool', code: ev.code, output: ev.output});
        } else if (ev.type === 'error'){
          failed = ev.message || 'خطای ناشناخته';
        } else if (ev.type === 'done'){
          finished = true;
        }
        schedule();
      };
      while (true){
        const {value, done} = await reader.read();
        if (done) break;
        buf += dec.decode(value, {stream: true});
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0){
          const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
          if (!chunk.startsWith('data:')) continue;
          try{ handle(JSON.parse(chunk.slice(5).trim())); }catch(e){}
        }
      }
      if (!finished && !failed && !partsText(parts) && !parts.length) failed = 'اتصال قطع شد.';
    }
  }catch(e){
    if (e.name !== 'AbortError')
      failed = 'اتصال برقرار نشد. اگر سایت خواب بوده، یک دقیقه صبر کن و دوباره بفرست.';
  }

  if (raf) cancelAnimationFrame(raf);
  parts.forEach(p => { if (p.t === 'tool' && p.output === null) p.output = '(متوقف شد)'; });
  const reply = partsText(parts);
  if (parts.length){
    renderBot(node, parts, false);
    c.messages.push({role: 'assistant', content: reply || '(اجرای ابزار)', parts});
    if (failed) addErr(failed);
  } else {
    // پاسخی نیامد (خطا یا توقف): پیام کاربر برمی‌گردد به کادر نوشتن
    c.messages.pop();
    if (!c.messages.length) c.title = 'گفتگوی تازه';
    if (input.value === '') input.value = text;
    renderChat();
    if (failed) addErr(failed);
  }
  c.updated = Date.now(); saveConvs();
  abortCtl = null; setBusy(false); input.focus();
}

$('form').addEventListener('submit', e => { e.preventDefault(); send(); });
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

/* ---------- فهرست گفتگوها ---------- */
function closeOv(id){ $(id).classList.remove('on'); }
function renderConvs(){
  const box = $('convList'); box.textContent = '';
  if (!convs.length){ box.appendChild(el('div', 'note', 'هن
